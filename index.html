<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary SEO -->
    <title>[YOUR NAME] — AI Engineer &amp; Data Scientist</title>
    <meta
      name="description"
      content="[YOUR NAME] is an AI Engineer building intelligent, production-ready systems — machine learning, LLMs, RAG, APIs and cloud infrastructure."
    />
    <meta name="author" content="[YOUR NAME]" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="[YOUR NAME] — AI Engineer & Data Scientist" />
    <meta
      property="og:description"
      content="I design and build end-to-end AI and data systems using Python, machine learning, LLMs, RAG, APIs, and modern cloud technologies."
    />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:image" content="https://example.com/og-image.png" />
    <meta property="og:site_name" content="[YOUR NAME] — Portfolio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="[YOUR NAME] — AI Engineer & Data Scientist" />
    <meta
      name="twitter:description"
      content="I design and build end-to-end AI and data systems using Python, machine learning, LLMs, RAG, APIs, and modern cloud technologies."
    />
    <meta name="twitter:image" content="https://example.com/og-image.png" />

    <!-- Fonts: IBM Plex Sans (display/body) + IBM Plex Mono (labels/code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: Person -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "[YOUR NAME]",
        "jobTitle": "[YOUR ROLE]",
        "url": "https://example.com/",
        "email": "mailto:[YOUR EMAIL]",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "[YOUR LOCATION]"
        },
        "sameAs": ["[YOUR GITHUB]", "[YOUR LINKEDIN]"]
      }
    </script>
  </head>
  <body class="bg-paper text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
